[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlog-auto-editor"
version = "0.1.0"
description = "Local-first FFmpeg rough-cut tools for human-directed vlogs"
requires-python = ">=3.11"

[project.scripts]
vlog-editor = "vlog_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
